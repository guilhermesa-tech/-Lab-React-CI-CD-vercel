name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Audit & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run linter
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Verify build
        run: npm run build

  docker:
    name: Build and test Docker image
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull --tag portfolio:${{ github.sha }} .

      - name: Run container smoke test
        run: |
          set -e
          trap 'docker rm --force portfolio-ci' EXIT
          docker run --detach --name portfolio-ci --publish 8080:80 portfolio:${{ github.sha }}

          # Aguarda 5 segundos para o container/servidor inicializar
          sleep 5

          # Tenta o curl com tolerância a conexões recusadas durante a subida
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8080/
